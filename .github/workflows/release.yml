name: Release

# Builds installers for every supported platform from a version tag (for example v1.2.0) and
# publishes them, with SHA-256 checksums and an updater manifest, as a draft GitHub Release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (for example v1.0.0)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav xdg-utils
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches project version
        run: node scripts/release/check-version.mjs "${{ env.RELEASE_TAG }}"
      - name: Prepare release configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release/tauri-config.mjs release-config.json
      - name: Build
        env:
          DARKLOAD_REPOSITORY: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --config release-config.json
      - name: Collect artifacts
        run: node scripts/release/collect.mjs --target ${{ matrix.target }} --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --out release
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-*
          merge-multiple: true
      - name: Updater manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release/latest-json.mjs release "${{ env.RELEASE_TAG }}"
      - name: Checksums
        working-directory: release
        run: |
          sha256sum $(ls | grep -v -e '\.sig$' -e '^SHA256SUMS.txt$' | sort) > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        run: node scripts/release/changelog-section.mjs "${{ env.RELEASE_TAG }}" > release-notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --draft \
            --verify-tag \
            --title "DarkLoad ${RELEASE_TAG#v}" \
            --notes-file release-notes.md
